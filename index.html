<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自作軽量レコーダー (全画面最適化版)</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f3f5;
            color: #333;
            max-width: 800px; /* 少し横幅を広げました */
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
        .description { color: #7f8c8d; font-size: 13px; margin-bottom: 20px; }
        
        .controls {
            margin: 20px 0;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        .setting-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .setting-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .setting-item input[type="checkbox"], .setting-item input[type="radio"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        button {
            font-size: 15px;
            font-weight: bold;
            padding: 10px 24px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        #startBtn { background-color: #2ecc71; color: white; }
        #startBtn:hover { background-color: #27ae60; }
        #stopBtn { background-color: #e74c3c; color: white; }
        #stopBtn:hover { background-color: #c0392b; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        
        #status {
            font-weight: bold;
            margin-top: 15px;
            color: #7f8c8d;
            font-size: 13px;
        }
        .status-recording { color: #e74c3c !important; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        
        #previewContainer {
            margin-top: 20px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        /* ★全画面表示・プレビュー最大化のために max-width: 500px; を解除しました */
        video, audio {
            width: 100%;
            max-width: 100%; /* 枠いっぱいに広がるように変更 */
            border-radius: 6px;
            background: #000;
        }
        audio { background: #f1f3f4; height: 50px; }
        .download-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>超軽量レコーダー</h1>
    <div class="description">Chromebook・低スペックPC最適化版（HD 720p / 30fps）</div>

    <div class="controls">
        <div class="setting-group">
            <span style="font-weight: bold; color: #7f8c8d; font-size:14px;">【モード】</span>
            <label class="setting-item">
                <input type="radio" name="recordMode" value="video" checked> 画面＋音声
            </label>
            <label class="setting-item">
                <input type="radio" name="recordMode" value="audio"> 音声のみ記録
            </label>
        </div>

        <div class="setting-group">
            <span style="font-weight: bold; color: #7f8c8d; font-size:14px;">【音声】</span>
            <label class="setting-item">
                <input type="checkbox" id="systemAudioCheck" checked> ゲームの音（システム音）
            </label>
            <label class="setting-item">
                <input type="checkbox" id="micAudioCheck" checked> マイク（自分の声）
            </label>
        </div>

        <button id="startBtn">記録開始</button>
        <button id="stopBtn" disabled>停止</button>
        
        <div id="status">準備完了</div>
    </div>

    <div id="previewContainer" style="display: none;">
        <h3>プレビュー / ダウンロード</h3>
        <div id="mediaPreviewPlace"></div>
        <br>
        <a id="downloadBtn" class="download-link" href="#">ファイルを保存する</a>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let audioContext;
        let audioDestination;
        let currentMode = "video";
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const systemAudioCheck = document.getElementById('systemAudioCheck');
        const micAudioCheck = document.getElementById('micAudioCheck');
        const mediaPreviewPlace = document.getElementById('mediaPreviewPlace');
        const previewContainer = document.getElementById('previewContainer');
        const downloadBtn = document.getElementById('downloadBtn');

        function getSupportedMimeType(mode) {
            if (mode === "audio") return 'audio/webm; codecs=opus';
            const types = [
                'video/webm; codecs=vp8,opus',
                'video/webm; codecs=h264,opus',
                'video/webm'
            ];
            for (let type of types) {
                if (MediaRecorder.isTypeSupported(type)) return type;
            }
            return '';
        }

        startBtn.addEventListener('click', async () => {
            recordedChunks = [];
            currentMode = document.querySelector('input[name="recordMode"]:checked').value;
            
            let videoTrack = null;
            let audioTracks = [];
            let displayStream = null;

            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioDestination = audioContext.createMediaStreamDestination();
                let hasAudio = false;

                if (currentMode === "video") {
                    // ★ getDisplayMedia の設定に displaySurface: "monitor" を追加
                    displayStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { 
                            width: { ideal: 1280, max: 1280 }, 
                            height: { ideal: 720, max: 720 }, 
                            frameRate: { ideal: 30, max: 30 },
                            displaySurface: "monitor" // 画面全体（モニター）の選択肢を優先表示
                        },
                        audio: true 
                    });
                    videoTrack = displayStream.getVideoTracks()[0];

                    if (systemAudioCheck.checked && displayStream.getAudioTracks().length > 0) {
                        const systemAudioSource = audioContext.createMediaStreamSource(new MediaStream([displayStream.getAudioTracks()[0]]));
                        systemAudioSource.connect(audioDestination);
                        hasAudio = true;
                    } else {
                        displayStream.getAudioTracks().forEach(t => t.stop());
                    }
                } 
                else if (currentMode === "audio" && systemAudioCheck.checked) {
                    try {
                        displayStream = await navigator.mediaDevices.getDisplayMedia({ 
                            video: { displaySurface: "monitor" }, // 音声のみの場合も一応設定
                            audio: true 
                        });
                        displayStream.getVideoTracks().forEach(t => t.stop());
                        if (displayStream.getAudioTracks().length > 0) {
                            const systemAudioSource = audioContext.createMediaStreamSource(new MediaStream([displayStream.getAudioTracks()[0]]));
                            systemAudioSource.connect(audioDestination);
                            hasAudio = true;
                        }
                    } catch(e) { console.warn(e); }
                }

                if (micAudioCheck.checked) {
                    try {
                        const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        const micAudioSource = audioContext.createMediaStreamSource(micStream);
                        micAudioSource.connect(audioDestination);
                        hasAudio = true;
                        audioTracks.push(...micStream.getAudioTracks());
                    } catch (err) {
                        console.warn(err);
                    }
                }

                const finalTracks = [];
                const mimeType = getSupportedMimeType(currentMode);

                if (currentMode === "video") {
                    finalTracks.push(videoTrack);
                    if (hasAudio) finalTracks.push(audioDestination.stream.getAudioTracks()[0]);
                } else {
                    if (hasAudio) finalTracks.push(audioDestination.stream.getAudioTracks()[0]);
                    else { alert("音声ソースがありません"); return; }
                }

                const combinedStream = new MediaStream(finalTracks);
                mediaRecorder = new MediaRecorder(combinedStream, { mimeType: mimeType });

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    if(videoTrack) videoTrack.stop();
                    audioTracks.forEach(t => t.stop());
                    if(displayStream) displayStream.getAudioTracks().forEach(t => t.stop());
                    if (audioContext) audioContext.close();

                    const blob = new Blob(recordedChunks, { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    
                    if (currentMode === "video") {
                        mediaPreviewPlace.innerHTML = `<video id="playback" controls src="${url}"></video>`;
                        downloadBtn.textContent = "動画を保存 (.webm)";
                    } else {
                        mediaPreviewPlace.innerHTML = `<audio id="playback" controls src="${url}"></audio>`;
                        downloadBtn.textContent = "音声を保存 (.webm)";
                    }
                    
                    downloadBtn.download = `${currentMode}_${Date.now()}.webm`;
                    downloadBtn.href = url;
                    previewContainer.style.display = 'block';
                    statusDiv.textContent = '記録終了！保存できます。';
                    statusDiv.classList.remove('status-recording');
                    
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                };

                mediaRecorder.start();
                statusDiv.classList.add('status-recording');
                statusDiv.textContent = currentMode === "video" ? "● 録画中（低負荷モード）..." : "● 録音中...";
                
                startBtn.disabled = true;
                stopBtn.disabled = false;

                if (videoTrack) {
                    videoTrack.onended = () => {
                        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                    };
                }

            } catch (err) {
                console.error(err);
                statusDiv.textContent = 'エラー：開始できませんでした。';
                if (videoTrack) videoTrack.stop();
                if (audioContext) audioContext.close();
            }
        });

        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        });
    </script>
</body>
</html>
