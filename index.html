<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高機能・軽量画面録画ツール</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .description { color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
        
        .controls {
            margin: 20px 0;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        .setting-group {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .setting-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .setting-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        button {
            font-size: 16px;
            font-weight: bold;
            padding: 12px 28px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        #startBtn { background-color: #2ecc71; color: white; }
        #startBtn:hover { background-color: #27ae60; }
        #stopBtn { background-color: #e74c3c; color: white; }
        #stopBtn:hover { background-color: #c0392b; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        
        #status {
            font-weight: bold;
            margin: 15px 0 0 0;
            color: #7f8c8d;
        }
        .status-recording { color: #e74c3c !important; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        
        #previewContainer {
            margin-top: 25px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        video {
            width: 100%;
            max-width: 640px;
            border-radius: 6px;
            background: #000;
        }
        .download-link {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .download-link:hover { background-color: #2980b9; }
        
        .notice {
            font-size: 12px;
            color: #e67e22;
            margin-top: 10px;
            text-align: left;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>軽量画面録画ツール</h1>
    <div class="description">GitHub Pages対応 / サーバー送信なしで安全</div>

    <div class="controls">
        <div class="setting-group">
            <label class="setting-item">
                <input type="checkbox" id="systemAudioCheck" checked> 画面の音（タブ・システム音）
            </label>
            <label class="setting-item">
                <input type="checkbox" id="micAudioCheck" checked> マイクの音（あなたの声）
            </label>
        </div>

        <button id="startBtn">録画開始</button>
        <button id="stopBtn" disabled>録画停止</button>
        
        <div id="status">準備完了</div>
    </div>

    <div id="previewContainer" style="display: none;">
        <h3>プレビュー / ダウンロード</h3>
        <video id="playback" controls></video>
        <br>
        <a id="downloadBtn" class="download-link" href="#" download="recording.webm">動画を保存する (.webm)</a>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let audioContext;
        let audioDestination;
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const systemAudioCheck = document.getElementById('systemAudioCheck');
        const micAudioCheck = document.getElementById('micAudioCheck');
        const playback = document.getElementById('playback');
        const previewContainer = document.getElementById('previewContainer');
        const downloadBtn = document.getElementById('downloadBtn');

        startBtn.addEventListener('click', async () => {
            recordedChunks = [];
            let videoTrack = null;
            let audioTracks = [];

            try {
                // 1. 画面・タブキャプチャの要求
                // 複数タブを同時に行き来して録画したい場合は、ポップアップで「画面全体」を選択してください。
                const displayStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: 1920, height: 1080, frameRate: 30 },
                    audio: true 
                });

                videoTrack = displayStream.getVideoTracks()[0];

                // 2. 音声のミキシング（Web Audio APIを使用）
                // 画面の音とマイクの音を綺麗に1つに合成します
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioDestination = audioContext.createMediaStreamDestination();
                let hasAudio = false;

                // 【設定1】画面の音（システム音）の処理
                if (systemAudioCheck.checked && displayStream.getAudioTracks().length > 0) {
                    const systemAudioSource = audioContext.createMediaStreamSource(new MediaStream([displayStream.getAudioTracks()[0]]));
                    systemAudioSource.connect(audioDestination);
                    hasAudio = true;
                } else {
                    // 使わない場合は、ブラウザが掴んでいるシステム音のトラックを明示的に停止
                    displayStream.getAudioTracks().forEach(t => t.stop());
                }

                // 【設定2】マイクの音（音声）の処理
                if (micAudioCheck.checked) {
                    try {
                        const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        const micAudioSource = audioContext.createMediaStreamSource(micStream);
                        micAudioSource.connect(audioDestination);
                        hasAudio = true;
                        
                        // 録画終了時にマイクも止まるようにトラックを保持
                        audioTracks.push(...micStream.getAudioTracks());
                    } catch (err) {
                        console.warn("マイクの許可がない、またはデバイスが見つかりません:", err);
                        alert("マイクの取得に失敗しました。マイク無しで続行します。");
                    }
                }

                // 3. ビデオと合成された音声を合流させる
                const tracks = [videoTrack];
                if (hasAudio) {
                    tracks.push(audioDestination.stream.getAudioTracks()[0]);
                }
                const combinedStream = new MediaStream(tracks);

                // 4. MediaRecorderの起動
                mediaRecorder = new MediaRecorder(combinedStream, {
                    mimeType: 'video/webm; codecs=vp9,opus'
                });

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    // 全てのストリーム・トラックを完全に停止
                    videoTrack.stop();
                    audioTracks.forEach(t => t.stop());
                    displayStream.getAudioTracks().forEach(t => t.stop());
                    if (audioContext) audioContext.close();

                    // データのダウンロード準備
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    
                    playback.src = url;
                    downloadBtn.href = url;
                    
                    previewContainer.style.display = 'block';
                    statusDiv.textContent = '録画終了！下のボタンから保存できます。';
                    statusDiv.classList.remove('status-recording');
                    
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                };

                mediaRecorder.start();
                statusDiv.textContent = '● 録画中...（複数タブを録画する場合は「画面全体」をキャプチャしてください）';
                statusDiv.classList.add('status-recording');
                
                startBtn.disabled = true;
                stopBtn.disabled = false;

                // ブラウザ側の「共有を停止」ボタンを押されたときの対策
                videoTrack.onended = () => {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                };

            } catch (err) {
                console.error("エラー:", err);
                statusDiv.textContent = 'エラー: 録画がキャンセルされたか、デバイスの権限がありません。';
                if (videoTrack) videoTrack.stop();
            }
        });

        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        });
    </script>
</body>
</html>
